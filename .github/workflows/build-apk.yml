name: Build Play Store App Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Scaffold Native Android App With Signing Key
        run: |
          mkdir -p android-project/app/src/main/java/info/naimishparekh/app
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/mipmap-anydpi-v26

          # 1. Generate digital signing certificate automatically
          keytool -genkeypair -v -keystore android-project/app/release.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias naimishkey -storepass naimish1234 -keypass naimish1234 -dname "CN=Naimish Parekh, OU=App, O=Fintech, L=Mumbai, ST=Maharashtra, C=IN"

          # 2. settings.gradle
          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NaimishParekhApp"
          include ':app'
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > android-project/build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          # 4. app/build.gradle with automated signing configuration
          cat << 'EOF' > android-project/app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'info.naimishparekh.app'
              compileSdk 34
              defaultConfig {
                  applicationId "info.naimishparekh.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "naimish1234"
                      keyAlias "naimishkey"
                      keyPassword "naimish1234"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # 5. Icon Definitions
          cat << 'EOF' > android-project/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#090E17" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0F172A" android:strokeColor="#1E293B" android:strokeWidth="1.2" android:pathData="M54,18 L85,36 L85,72 L54,90 L23,72 L23,36 Z"/>
          </vector>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:strokeColor="#38BDF8" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M39,70 L39,38"/>
              <path android:strokeColor="#38BDF8" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M39,38 L58,70"/>
              <path android:strokeColor="#38BDF8" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M58,70 L58,38"/>
              <path android:strokeColor="#34D399" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M58,38 C74,38 74,54 58,54"/>
              <path android:fillColor="#FFFFFF" android:pathData="M39,38m-3,0a3,3 0 1,0 6,0a3,3 0 1,0 -6,0"/>
              <path android:fillColor="#FFFFFF" android:pathData="M58,70m-3,0a3,3 0 1,0 6,0a3,3 0 1,0 -6,0"/>
              <path android:fillColor="#34D399" android:pathData="M70,46m-2.5,0a2.5,2.5 0 1,0 5,0a2.5,2.5 0 1,0 -5,0"/>
          </vector>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > android-project/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # 6. AndroidManifest.xml
          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Naimish Parekh"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. MainActivity.java
          cat << 'EOF' > android-project/app/src/main/java/info/naimishparekh/app/MainActivity.java
          package info.naimishparekh.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.net.http.SslError;
          import android.os.Bundle;
          import android.webkit.SslErrorHandler;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String TARGET_URL = "https://naimishparekh.info";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onReceivedSslError(WebView view, SslErrorHandler handler, SslError error) {
                          handler.proceed();
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("mailto:") || url.startsWith("tel:") || url.contains("linkedin.com")) {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              startActivity(intent);
                              return true;
                          }
                          view.loadUrl(url);
                          return true;
                      }
                  });

                  webView.loadUrl(TARGET_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Signed App Bundle (.aab)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android-project
          gradle bundleRelease --stacktrace

      - name: Upload Play Store Bundle
        uses: actions/upload-artifact@v4
        with:
          name: NaimishParekh-PlayStore-Bundle
          path: android-project/app/build/outputs/bundle/release/app-release.aab
